<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<link rel="icon" type="image/png" href="/favicon.png">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mot de passe — Back office</title>
<link rel="stylesheet" href="/fonts.css">
<link rel="stylesheet" href="/fontawesome.css">
<link rel="stylesheet" href="/style.css">
<link rel="stylesheet" href="/admin.css">
</head>
<body>
<header class="site-header">
  <div class="wrap nav">
    <a href="/" class="brand"><img src="/logo.png" alt="EVA Compta Consulting SARL" class="brand-logo"></a>
    <div style="margin-left:auto;display:flex;gap:12px;align-items:center;">
      <a href="/" class="nav-cta" style="background:var(--ink-soft);">Voir le site</a>
      <form th:action="@{/logout}" method="post" style="margin:0;">
        <button type="submit" class="nav-cta" style="border:none;cursor:pointer;"><i class="fa-solid fa-right-from-bracket"></i> Se déconnecter</button>
      </form>
    </div>
  </div>
</header>

<div class="bo-wrap">
  <div class="bo-head">
    <h1><i class="fa-solid fa-key" style="color:var(--accent);"></i> Mot de passe</h1>
    <a th:href="@{/admin}" class="btn-bo ghost"><i class="fa-solid fa-arrow-left"></i> Retour</a>
  </div>

  <div class="bo-tabs">
    <a th:href="@{/admin}" class="bo-tab"><i class="fa-solid fa-graduation-cap"></i> Formations</a>
    <a th:href="@{/admin/associes}" class="bo-tab"><i class="fa-solid fa-user-tie"></i> Associés</a>
    <a th:href="@{/admin/password}" class="bo-tab on"><i class="fa-solid fa-key"></i> Mot de passe</a>
  </div>

  <div class="bo-card" style="max-width:460px;">
    <h2><i class="fa-solid fa-key"></i> Changer le mot de passe</h2>
    <div class="bo-flash" th:if="${msg}" th:text="${msg}"></div>
    <div class="bo-flash err" th:if="${err}" th:text="${err}"></div>
    <form th:action="@{/admin/password}" method="post">
      <label>Ancien mot de passe</label>
      <input type="password" name="ancien" required>
      <label>Nouveau mot de passe (6 caractères min.)</label>
      <input type="password" name="nouveau" required>
      <label>Confirmer le nouveau mot de passe</label>
      <input type="password" name="confirmation" required>
      <button type="submit" class="btn-bo" style="margin-top:20px;"><i class="fa-solid fa-check"></i> Mettre à jour</button>
    </form>
  </div>
</div>

</body>
</html>
