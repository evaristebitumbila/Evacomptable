# ============================================================
#  Configuration de l'application EVA Compta Consulting
# ============================================================

spring.application.name=EVA Compta Consulting

# ---- Base de donnees H2 EN FICHIER (persistante) ----
# Le fichier est cree dans ./data/evacompta.mv.db a cote du projet.
spring.datasource.url=jdbc:h2:file:./data/evacompta
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# ---- JPA / Hibernate ----
# update = cree/complete les tables au demarrage sans effacer les donnees
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=true

# ---- Console H2 (pour inspecter la base : http://localhost:8080/h2-console) ----
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# ---- Upload d'images ----
# Dossier physique ou sont stockees les images televersees
app.upload.dir=uploads
# Taille max d'un fichier / d'une requete
spring.servlet.multipart.max-file-size=8MB
spring.servlet.multipart.max-request-size=8MB

# ---- Serveur ----
server.port=8080

# ---- Thymeleaf : desactiver le cache en developpement ----
spring.thymeleaf.cache=false
